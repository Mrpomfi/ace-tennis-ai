name: Prepare local MediaPipe assets

on:
  workflow_dispatch:
  push:
    branches:
      - feature/local-pose-assets-v2

permissions:
  contents: write

jobs:
  vendor-mediapipe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/local-pose-assets-v2
          fetch-depth: 0

      - name: Download pinned MediaPipe package and pose model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/mediapipe/wasm
          curl -fsSL https://registry.npmjs.org/@mediapipe/tasks-vision/-/tasks-vision-0.10.22.tgz -o /tmp/tasks-vision.tgz
          mkdir -p /tmp/mp-package
          tar -xzf /tmp/tasks-vision.tgz -C /tmp/mp-package
          test -s /tmp/mp-package/package/vision_bundle.mjs
          cp /tmp/mp-package/package/vision_bundle.mjs vendor/mediapipe/vision_bundle.mjs
          cp -R /tmp/mp-package/package/wasm/. vendor/mediapipe/wasm/
          curl -fsSL https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task -o vendor/mediapipe/pose_landmarker_lite.task
          test -s vendor/mediapipe/pose_landmarker_lite.task
          test -s vendor/mediapipe/wasm/vision_wasm_internal.js
          test -s vendor/mediapipe/wasm/vision_wasm_internal.wasm
          echo "MediaPipe assets downloaded:"
          du -sh vendor/mediapipe

      - name: Commit assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/mediapipe
          if git diff --cached --quiet; then
            echo "Assets already current; no commit needed."
          else
            git commit -m "Add local MediaPipe pose analysis assets"
            git push origin HEAD:feature/local-pose-assets-v2
          fi
